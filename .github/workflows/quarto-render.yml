name: Build and Publish Quarto Site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Quarto
        run: |
          sudo apt-get update
          sudo apt-get install -y quarto

      - name: Check Quarto version
        run: quarto --version

      - name: Render site
        run: |
          quarto render 2>&1 | tee render.log
          cat render.log

      - name: Upload render logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: render-logs
          path: render.log

      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
