name: Build and Publish Quarto Site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Quarto
        run: |
          wget https://github.com/quarto-dev/quarto-cli/releases/download/v1.4.555/quarto-1.4.555-linux-amd64.deb
          sudo dpkg -i quarto-1.4.555-linux-amd64.deb

      - name: Check Quarto version
        run: quarto --version

      - name: Render site and capture error
        run: |
          quarto render > /tmp/quarto.out 2>&1 || true
          cat /tmp/quarto.out
          cp /tmp/quarto.out quarto-output.txt

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: quarto-logs
          path: quarto-output.txt

      - name: Show output for debugging
        run: cat quarto-output.txt

      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
