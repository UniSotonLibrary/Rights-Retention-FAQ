name: Build and Publish Quarto Site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Install Quarto
        run: |
          wget https://github.com/quarto-dev/quarto-cli/releases/download/v1.4.555/quarto-1.4.555-linux-amd64.deb
          sudo dpkg -i quarto-1.4.555-linux-amd64.deb

      - name: Check environment
        run: |
          which quarto
          quarto --version
          pandoc --version
          ls -la

      - name: Render site
        run: quarto render 2>&1 | tee render.log

      - name: Check if _site exists
        run: |
          if [ -d "_site" ]; then
            echo "✓ _site directory created successfully"
            ls -la _site
          else
            echo "✗ _site directory not found"
            cat render.log
          fi
