name: Build and Publish Quarto Site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Quarto
        run: |
          wget https://github.com/quarto-dev/quarto-cli/releases/download/v1.4.555/quarto-1.4.555-linux-amd64.deb
          sudo dpkg -i quarto-1.4.555-linux-amd64.deb

      - name: Check Quarto version
        run: quarto --version

      - name: List files
        run: |
          echo "=== Root directory ==="
          ls -la
          echo "=== Checking index.qmd ==="
          head -50 index.qmd
          echo "=== Checking rr-faqs.bib ==="
          head -20 rr-faqs.bib

      - name: Try rendering with verbose output
        run: |
          set -x
          quarto render --debug 2>&1 | head -500
        continue-on-error: true

      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
